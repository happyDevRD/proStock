name: Backend CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: us-east1-docker.pkg.dev
  PROJECT: prostock-elgarcia-prod
  IMAGE: us-east1-docker.pkg.dev/prostock-elgarcia-prod/prostock/backend
  REGION: us-east1

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Compile
        run: ./gradlew compileJava

      - name: Test
        run: ./gradlew test --tests "*SaleControllerExportTest" --tests "*DgiiTaxUtilsTest"

  deploy:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/913158557796/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@prostock-elgarcia-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy happydevs
        run: |
          gcloud run deploy prostock-happydevs-backend \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT }} \
            --quiet

      - name: Deploy iridiscencia
        run: |
          gcloud run deploy prostock-iridiscencia-backend \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT }} \
            --quiet
