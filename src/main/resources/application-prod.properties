# Perfil producción (activar con SPRING_PROFILES_ACTIVE=prod)
# Variables obligatorias recomendadas: DB_URL, DB_USERNAME, DB_PASSWORD, APP_CORS_ALLOWED_ORIGINS

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.security.allow-swagger=false

# Orígenes del front (navegador), separados por coma. Ej: https://app.midominio.com,https://192.168.1.50
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Archivos subidos (NAS o volumen persistente; ruta absoluta recomendada)
storage.location=${STORAGE_LOCATION:/data/uploads}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:25MB}

server.forward-headers-strategy=framework

logging.level.root=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR
