# Base de datos local (sobrescribible por variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prestockdb}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}

# Mismo comportamiento que prod: migraciones Flyway + Hibernate validate (heredado de application.properties).

# CORS local (Vite 3000; 127.0.0.1 por si el navegador usa esa forma)
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081

# Swagger habilitado en local
app.security.allow-swagger=true

# Usuario bootstrap local (solo si no existe en BD)
app.security.bootstrap.username=${SECURITY_BOOTSTRAP_USERNAME:admin}
app.security.bootstrap.password=${SECURITY_BOOTSTRAP_PASSWORD:admin1234}
app.security.bootstrap.email=${SECURITY_BOOTSTRAP_EMAIL:admin@prostock.local}
